name: sync-metrics

# Keep wom/enums.py current with the live Wise Old Man metric catalogue with no
# human in the loop for the common case. Weekly (and on demand): diff our enum
# against @wise-old-man/utils; if WOM added metrics, add them, run the tests,
# and commit — automatically. The ONLY time a human is pinged is when the job
# FAILS (source unreachable / format changed / tests broke) — GitHub emails the
# repo watchers on a failed scheduled run.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: droptracker

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + test deps
        run: pip install -e . pytest pytest-asyncio

      - name: Sync metrics from WOM
        id: sync
        run: |
          set +e
          python tools/sync_metrics.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 10 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::sync_metrics.py failed (exit $code) — needs a human"
            exit "$code"
          fi

      - name: Test the updated enum
        if: steps.sync.outputs.changed == 'true'
        run: pytest tests/ -q

      - name: Commit + push
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "dt-wom-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wom/enums.py
          git commit -m "sync: add new WOM metrics from @wise-old-man/utils"
          git push origin droptracker
