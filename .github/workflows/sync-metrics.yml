name: sync-metrics

# Keep wom/enums.py current with the live Wise Old Man metric catalogue with no
# human in the loop for the common case: diff our enum against
# @wise-old-man/utils; if WOM added metrics, add them, run the tests, and commit
# — automatically. The ONLY time a human is pinged is when the job FAILS
# (source unreachable / format changed / tests broke) — GitHub emails the repo
# watchers on a failed scheduled run.
#
# Cadence is weighted towards OSRS update days. Game updates ship on Wednesdays,
# and WOM's own catalogue follows within hours, so Wed/Thu are checked hourly to
# pick new bosses/skills up the same day; the rest of the week is every 12h,
# which is plenty for a catalogue that otherwise rarely moves. A no-change run
# makes zero commits and triggers nothing downstream, so the extra frequency
# costs only CI minutes.

on:
  schedule:
    - cron: "0 * * * 3,4" # hourly, Wednesdays + Thursdays (OSRS update days)
    - cron: "0 0,12 * * 0,1,2,5,6" # every 12h, rest of the week
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: droptracker

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + test deps
        run: pip install -e . pytest pytest-asyncio

      - name: Sync metrics from WOM
        id: sync
        run: |
          set +e
          python tools/sync_metrics.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 10 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::sync_metrics.py failed (exit $code) — needs a human"
            exit "$code"
          fi

      - name: Test the updated enum
        if: steps.sync.outputs.changed == 'true'
        run: pytest tests/ -q

      - name: Commit + push
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "dt-wom-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wom/enums.py
          git commit -m "sync: add new WOM metrics from @wise-old-man/utils"
          git push origin droptracker
